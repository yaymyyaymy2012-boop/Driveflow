name: Build DriveFlow APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bestanden op de juiste plek zetten
        run: |
          mkdir -p www assets
          [ -f index.html ] && cp index.html www/index.html || true
          [ -f icon-512.png ] && cp icon-512.png assets/icon-512.png || true
          ls -R www assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Add Android
        run: npx cap add android
      - name: Patch (permissies + icoon)
        run: |
          pip install pillow
          python3 patch_android.py
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DriveFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
