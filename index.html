<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>GameFlow</title>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b1220;--card:#151f33;--edge:#22304d;--text:#e8eefc;--muted:#8da0c4;--deep:#0e1626;--accent:#1cb0f6;--accent-d:#0f6fa0;--ink:#06223a;--good:#58cc02;--good-d:#3d8f00;--bad:#ff4b4b;--gold:#ffc800;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.top h1{font-size:1.6rem;margin:0;flex:1;font-weight:900;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:.8rem;font-weight:800}
.coins{background:var(--card);border:2px solid var(--edge);border-bottom-width:4px;border-radius:14px;padding:6px 12px;font-weight:900;color:var(--gold)}
.scroll{flex:1;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;transition:transform .08s}
.card:active{transform:translateY(3px);border-bottom-width:2px}
.card .ic{font-size:2.4rem;line-height:1.1}
.card .nm{font-weight:900;margin-top:6px}
.card .ds{color:var(--muted);font-size:.74rem;margin-top:2px;font-weight:700}
.card .pg{margin-top:8px;height:8px;background:var(--deep);border-radius:8px;overflow:hidden}
.card .pg i{display:block;height:100%;background:var(--good);border-radius:8px}
.hero{background:linear-gradient(135deg,#1a2f55,#2b1f55);border-color:#3b4f87;display:flex;gap:14px;align-items:center;text-align:left;margin-bottom:14px}
.hero .ic{font-size:3rem}
.sec{color:var(--muted);font-size:.78rem;letter-spacing:.12em;font-weight:900;margin:16px 2px 8px}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:900;font-size:.95rem;color:var(--ink);background:var(--accent);box-shadow:0 4px 0 var(--accent-d);cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.sec2{background:var(--card);color:var(--text);box-shadow:0 4px 0 var(--edge);border:2px solid var(--edge)}
.btn.green{background:var(--good);box-shadow:0 4px 0 var(--good-d);color:#0b2a00}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #b32d2d;color:#3a0000}
.btn:disabled{opacity:.45}
.btn.sm{padding:8px 12px;font-size:.78rem}
.back{background:var(--card);border:2px solid var(--edge);border-bottom-width:4px;color:var(--text);border-radius:14px;width:44px;height:44px;font-size:1.2rem;font-weight:900;cursor:pointer}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:16px;background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;cursor:pointer;position:relative}
.lv.done{background:#16341f;border-color:#2c6b3a;color:#9be28a}
.lv.next{background:var(--accent);color:var(--ink);border-color:var(--accent-d)}
.lv.lock{opacity:.35}
.lv:active{transform:translateY(3px)}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 12px 16px;position:relative;overflow-y:auto}
#stage canvas{max-width:100%;max-height:100%;border-radius:18px;border:2px solid var(--edge);background:var(--deep);touch-action:none}
.hint{color:var(--muted);font-size:.8rem;margin:8px 0 0;text-align:center}
.hud{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 8px;font-weight:900}
.hud span{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:4px 10px;font-size:.85rem}
.overlay{position:absolute;inset:0;background:rgba(5,9,18,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.panel{background:var(--card);border:2px solid var(--edge);border-bottom-width:6px;border-radius:24px;padding:22px;width:100%;max-width:340px;text-align:center}
.panel h2{margin:0 0 6px;font-size:1.5rem;font-weight:900}
.panel p{color:var(--muted);margin:4px 0 14px}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--deep);border:2px solid var(--edge);padding:10px 16px;border-radius:14px;font-weight:900;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
/* game specifics */
.board{display:grid;gap:8px;width:min(92vw,360px)}
.cell{aspect-ratio:1;border-radius:14px;background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;cursor:pointer}
.cell:active{transform:translateY(3px)}
.cell.open{background:var(--deep);border-bottom-width:2px}
.cell.hit{background:#16341f;border-color:#2c6b3a}
.cell.mine{background:#4a1c1c;border-color:#8a2c2c}
.big{font-size:2.2rem;font-weight:900}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,360px);margin-top:14px}
.opts .btn{font-size:1.4rem;padding:16px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(80vw,320px)}
.pad{aspect-ratio:1;border-radius:24px;opacity:.55;border:0;cursor:pointer;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.04)}
.flip{perspective:600px}
/* PET */
#petView{background:#0b1220}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 6px}
.ps{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:4px 6px;font-size:.7rem;text-align:center}
.ps b{display:block;font-size:1rem}
.ps .bar{height:6px;background:var(--deep);border-radius:6px;margin-top:3px;overflow:hidden}
.ps .bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
#room{flex:1;min-height:0;margin:0 14px;border-radius:24px;border:2px solid var(--edge);border-bottom-width:6px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#room .floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:rgba(0,0,0,.18)}
#petBox{position:relative;width:min(62vw,250px);aspect-ratio:1;margin-bottom:6%;transition:transform .3s}
#petBox svg{width:100%;height:100%;overflow:visible}
.bounce{animation:bnc 1.8s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(.98,1.02)}}
.jump{animation:jmp .5s ease}
@keyframes jmp{0%{transform:translateY(0)}40%{transform:translateY(-34px) scale(1.05)}100%{transform:translateY(0)}}
.blink{animation:blk 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.poop{position:absolute;font-size:2rem;cursor:pointer;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fx{position:absolute;pointer-events:none;font-size:1.6rem;animation:fly 1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.tabs{display:flex;gap:6px;padding:10px 14px 12px}
.tab{flex:1;background:var(--card);border:2px solid var(--edge);border-bottom-width:4px;border-radius:14px;padding:8px 2px;text-align:center;font-size:.64rem;font-weight:900;color:var(--muted);cursor:pointer}
.tab .e{font-size:1.4rem;display:block}
.tab.on{border-color:var(--accent);color:var(--accent)}
#tray{padding:0 14px 6px;min-height:68px;display:flex;gap:8px;overflow-x:auto;align-items:center}
.it{flex:0 0 auto;background:var(--card);border:2px solid var(--edge);border-bottom-width:4px;border-radius:14px;padding:6px 10px;text-align:center;font-size:.7rem;cursor:pointer;min-width:64px}
.it .e{font-size:1.6rem;display:block}
.it.dis{opacity:.4}
.night{position:absolute;inset:0;background:rgba(5,8,25,.72);pointer-events:none}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 6px}
input.name{width:100%;padding:12px;border-radius:14px;border:2px solid var(--edge);background:var(--deep);color:var(--text);font:inherit;font-weight:900;text-align:center;margin:6px 0 12px;font-size:1rem}

#app{max-width:640px;margin:0 auto;width:100%}
.btn{color:var(--ink)}
.btn.sec2{color:var(--text)}
.sub{color:var(--muted)}
#nav{flex-shrink:0;display:flex;align-items:flex-end;background:var(--card);border-top:2px solid var(--edge);padding:6px 10px 8px}
#nav.hide{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:inherit;font-size:.66rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:6px 0;cursor:pointer}
#nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent)}
#nav .plus{margin-top:-24px}
#nav .plus i{width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--accent-d);font-style:normal;transition:transform .08s}
#nav .plus:active i{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
#nav .plus svg{width:32px;height:32px;stroke-width:3.4}
.card.g{border-color:transparent;color:#fff}
.card.g .ds{color:rgba(255,255,255,.75)}
.card.g .pg{background:rgba(0,0,0,.35)}
.card.add{border-style:dashed;background:transparent}
.card .del{position:absolute;top:6px;right:8px;font-size:.9rem;opacity:.8;padding:4px}
.card{position:relative}
.ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow-y:auto;background:var(--bg);border:2px solid var(--edge);border-bottom:none;border-radius:26px 26px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h2{margin:0 0 6px;font-size:1.3rem;font-weight:900}
.sd{color:var(--muted);font-size:.86rem;margin:0 0 14px;line-height:1.4}
.field{width:100%;background:var(--card);color:var(--text);border:2px solid var(--edge);border-radius:14px;padding:13px 14px;font:inherit;font-size:1rem;outline:none;margin-bottom:12px;user-select:text;-webkit-user-select:text}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:110px;resize:vertical}
.err{min-height:1.2em;color:var(--bad);font-size:.84rem;margin-bottom:8px}
.lbl{color:var(--muted);font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin:6px 2px 8px}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--deep);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font:inherit;font-size:.78rem;font-weight:900;color:var(--muted);background:none;border:0;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--ink);box-shadow:0 3px 0 var(--accent-d)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:4px 0 10px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--edge);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--text)}
.card.st{text-align:left;cursor:default}
.card.st:active{transform:none;border-bottom-width:5px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:900;text-transform:uppercase;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.red{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ctl{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.ctl .btn{font-size:1.2rem;padding:12px 16px;min-width:54px}
.opt-b{font-size:1.15rem!important;text-transform:none!important}
.qbar{height:10px;border-radius:9px;background:var(--deep);width:min(92vw,340px);overflow:hidden;margin:6px 0 12px}
.qbar i{display:block;height:100%;background:var(--good);width:100%}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:min(94vw,340px);background:#15357a;padding:6px;border-radius:16px}
.c4 div{aspect-ratio:1;border-radius:50%;background:var(--deep)}
.c4 .p1{background:#ff4b4b}.c4 .p2{background:#ffc800}
.input-in{user-select:text;-webkit-user-select:text}
.hero{color:#fff}.hero .ds{color:rgba(255,255,255,.75)}
.scroll{padding-bottom:44px}
.tplg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--card);border:2px solid var(--edge);border-bottom-width:5px;border-radius:18px;padding:10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tpl small{color:var(--muted);font-size:.68rem;font-weight:700;line-height:1.25}
.tpl.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chipb{flex-shrink:0;background:var(--card);border:2px solid var(--edge);border-radius:12px;font-size:1.3rem;padding:4px 8px;cursor:pointer}
.hero{color:#fff}.hero .ds{color:rgba(255,255,255,.75)}
.scroll{padding-bottom:44px}
</style>
</head>
<body>
<div id="app">
  <section class="view on" id="home">
    <div class="top"><div style="flex:1"><h1>GameFlow</h1><div class="sub" id="homeSub"></div></div><div class="coins" id="coinsHome">🪙 0</div></div>
    <div class="scroll" id="homeList"></div>
  </section>
  <section class="view" id="create">
    <div class="top"><div style="flex:1"><h1 id="crT"></h1><div class="sub" id="crS"></div></div></div>
    <div class="scroll" id="createBody"></div>
  </section>
  <section class="view" id="settings">
    <div class="top"><div style="flex:1"><h1 id="seT"></h1></div></div>
    <div class="scroll" id="setBody"></div>
  </section>
  <section class="view" id="levels">
    <div class="top"><button class="back" onclick="go('home')">←</button><h1 id="lvTitle"></h1></div>
    <div class="scroll"><p class="hint" id="lvDesc" style="margin:0 0 12px"></p><div class="lvls" id="lvGrid"></div></div>
  </section>
  <section class="view" id="play">
    <div class="top"><button class="back" id="playBack">←</button><h1 id="playTitle" style="font-size:1.2rem"></h1><button class="back" id="playRetry">↻</button></div>
    <div id="stage"></div>
  </section>
  <section class="view" id="petView">
    <div class="top"><button class="back" onclick="petLeave()">←</button><div style="flex:1"><h1 id="petName" style="font-size:1.3rem"></h1><div class="sub" id="petStage"></div></div><div class="coins" id="coinsPet">🪙 0</div></div>
    <div class="pstats" id="pstats"></div>
    <div id="room"><div class="floor"></div><div id="petBox"></div></div>
    <div id="tray"></div>
    <div class="tabs" id="tabs"></div>
  </section>
  <nav id="nav">
    <button data-v="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span id="nvH"></span></button>
    <button class="plus" data-v="create" onclick="go('create')"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i><span id="nvC"></span></button>
    <button data-v="settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span id="nvS"></span></button>
  </nav>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ================= basis ================= */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); if (/^gf_(wallet|prog|hs|pet|custom|g2048)$/.test(k)) { localStorage.setItem('gf_at', String(Date.now())); cloudPushSoon(); } } catch (e) {} }
let toastT;
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 1800); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---- taal + thema ---- */
const EN = {
  'Home': 'Home', 'Maak game': 'Create', 'Instellingen': 'Settings', 'Games': 'Games', 'Mijn games': 'My games', 'Huisdier': 'Pet',
  'Account': 'Account', 'Taal': 'Language', 'Thema': 'Theme', 'Kleur': 'Colour', 'Donker': 'Dark', 'Licht': 'Light', 'Neon': 'Neon', 'Bos': 'Forest',
  'Opnieuw': 'Again', 'Menu': 'Menu', 'Volgende': 'Next', 'Gewonnen!': 'You won!', 'Helaas': 'Too bad', 'Game over': 'Game over', 'Nieuw record!': 'New record!', 'Score': 'Score', 'Beste': 'Best',
  'Inloggen': 'Log in', 'Account maken': 'Create account', 'Uitloggen': 'Log out', 'Annuleren': 'Cancel', 'Sluiten': 'Close', 'Opslaan': 'Save', 'Verwijderen': 'Delete',
  'Gebruikersnaam': 'Username', 'Wachtwoord': 'Password', 'Verbonden': 'Connected', 'Niet ingelogd': 'Not logged in', 'Nu synchroniseren': 'Sync now',
  'Boter kaas': 'Tic-tac-toe', 'Mollen': 'Whack-a-mole', 'Mijnenveger': 'Minesweeper', 'Vier op een rij': 'Connect 4', 'Torenbouw': 'Tower stack', 'Ruimtegevecht': 'Invaders', 'Blokkenpuzzel': 'Block blast',
  'Maak je eigen game': 'Make your own game', 'Kies een sjabloon, pas het aan en speel direct.': 'Pick a template, tweak it and play instantly.',
  'Naam': 'Name', 'Sjabloon': 'Template', 'Vangen': 'Catch', 'Tikken': 'Tap', 'Quiz': 'Quiz', 'Moeilijkheid': 'Difficulty', 'Makkelijk': 'Easy', 'Normaal': 'Normal', 'Moeilijk': 'Hard',
  'Game maken': 'Create game', 'Nog geen eigen games. Maak er een met +.': 'No games of your own yet. Make one with +.', 'Weet je het zeker?': 'Are you sure?',

function showAuth() {
  openSheet(`<h2>DriveFlow-account</h2><p class="sd">${t('Log in met je DriveFlow-account om je munten, voortgang, huisdier en eigen games op al je apparaten te hebben.')}</p>
    <input class="field" id="au-n" placeholder="${t('Gebruikersnaam')}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
    <input class="field" id="au-p" type="password" placeholder="${t('Wachtwoord')}" autocomplete="current-password">
    <div class="err" id="au-e"></div>
    <div class="stack"><button class="btn" id="au-l">${t('Inloggen')}</button><button class="btn sec2" id="au-r">${t('Account maken')}</button><button class="btn sec2" onclick="closeSheet()">${t('Sluiten')}</button></div>`);
  const go2 = async reg => {
    const n = $('au-n').value.trim(), p = $('au-p').value; if (!CLOUD.available) { $('au-e').textContent = 'Cloud is niet beschikbaar (geen internet?).'; return; }
    if (!/[a-z0-9]/i.test(n)) { $('au-e').textContent = 'Vul een gebruikersnaam in.'; return; } if (!p) { $('au-e').textContent = 'Vul je wachtwoord in.'; return; }
    $('au-l').disabled = $('au-r').disabled = true;
    try { if (reg) await firebase.auth().createUserWithEmailAndPassword(userToEmail(n), p); else await firebase.auth().signInWithEmailAndPassword(userToEmail(n), p); closeSheet(); }
    catch (e) { $('au-e').textContent = authErr(e); $('au-l').disabled = $('au-r').disabled = false; }
  };
  $('au-l').onclick = () => go2(false); $('au-r').onclick = () => go2(true); $('au-p').onkeydown = e => { if (e.key === 'Enter') go2(false); };
}
async function logout() { if (!(await confirmSheet(t('Uitloggen') + '?', '', t('Uitloggen')))) return; await cloudPush(); try { await firebase.auth().signOut(); } catch (e) {} }
async function syncNow() { if (!CLOUD.uid) return showAuth(); CLOUD.busy = true; renderSettings(); await cloudPull(); CLOUD.busy = false; toast(CLOUD.err || '☁ OK'); renderSettings(); }
function initCloud() {
  CLOUD.available = typeof firebase !== 'undefined';
  if (!CLOUD.available) return;
  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } catch (e) { CLOUD.available = false; return; }
  firebase.auth().onAuthStateChanged(async u => {
    if (u) { CLOUD.uid = u.uid; CLOUD.name = (u.email || '').split('@')[0]; if (CUR === 'settings') renderSettings(); await cloudPull(); }
    else { CLOUD.uid = null; CLOUD.name = ''; }
    if (CUR === 'settings') renderSettings();
  });
  window.addEventListener('online', () => { if (CLOUD.uid) cloudPull(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && CLOUD.uid) cloudPush(); });
}

/* ================= instellingen ================= */
function setLang(l) { CFG.lang = l; saveCfg(); applyTheme(); renderSettings(); }
function setTheme(k) { CFG.theme = k; saveCfg(); applyTheme(); renderSettings(); }
function setAccent(a) { CFG.accent = a; saveCfg(); applyTheme(); renderSettings(); }
async function wipe() { if (!(await confirmSheet(t('Voortgang wissen') + '?', t('Weet je het zeker?'), t('Voortgang wissen')))) return; SAVE_KEYS.concat(['gf_at']).forEach(k => localStorage.removeItem(k)); if (CLOUD.uid) { localStorage.setItem('gf_at', String(Date.now())); WALLET = { coins: 25 }; PROG = {}; HS = {}; CUSTOM = []; ['gf_wallet', 'gf_prog', 'gf_hs', 'gf_custom'].forEach(k => lsSet(k, k === 'gf_wallet' ? WALLET : k === 'gf_custom' ? [] : {})); localStorage.removeItem('gf_pet'); lsSet('gf_pet', null); await cloudPush(); } location.reload(); }
function renderSettings() {
  $('seT').textContent = t('Instellingen');
  const ago = CLOUD.last ? new Date(CLOUD.last).toLocaleTimeString(CFG.lang === 'en' ? 'en' : 'nl', { hour: '2-digit', minute: '2-digit' }) : '';
  $('setBody').innerHTML = `
    <div class="sec">${t('Account').toUpperCase()}</div>
    <div class="card st"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:1.1rem">${CLOUD.uid ? esc(CLOUD.name) : 'DriveFlow'}</b>${CLOUD.uid ? `<span class="pill">${t('Verbonden')}</span>` : `<span class="pill red">${t('Niet ingelogd')}</span>`}</div>
      <p class="sd" style="margin:8px 0 12px">${CLOUD.uid ? '☁ ' + (ago ? ago + ' · ' : '') + (CLOUD.err ? esc(CLOUD.err) : 'Munten, voortgang, huisdier en eigen games worden bewaard.') : t('Log in met je DriveFlow-account om je munten, voortgang, huisdier en eigen games op al je apparaten te hebben.')}${CLOUD.available ? '' : '<br>Cloud niet beschikbaar (geen internet).'}</p>
      ${CLOUD.uid ? `<div class="row2"><button class="btn" ${CLOUD.busy ? 'disabled' : ''} onclick="syncNow()">☁ ${t('Nu synchroniseren')}</button><button class="btn sec2" onclick="logout()">${t('Uitloggen')}</button></div>` : `<button class="btn" style="width:100%" onclick="showAuth()">${t('Inloggen')} / ${t('Account maken')}</button>`}</div>
    <div class="sec">${t('Taal').toUpperCase()}</div>
    <div class="card st"><div class="seg" style="margin:0"><button class="${CFG.lang === 'nl' ? 'on' : ''}" onclick="setLang('nl')">Nederlands</button><button class="${CFG.lang === 'en' ? 'on' : ''}" onclick="setLang('en')">English</button></div></div>
    <div class="sec">${t('Thema').toUpperCase()}</div>
    <div class="card st"><div class="seg">${Object.keys(THEMES).map(k => `<button class="${CFG.theme === k ? 'on' : ''}" onclick="setTheme('${k}')">${t(THEME_NAMES[k])}</button>`).join('')}</div>
      <div class="lbl">${t('Kleur')}</div><div class="swatches" style="padding-bottom:0">${ACCENTS.map(a => `<div class="sw ${CFG.accent === a ? 'on' : ''}" style="background:${a}" onclick="setAccent('${a}')"></div>`).join('')}</div></div>
    <div style="margin-top:18px"><button class="btn red" style="width:100%" onclick="wipe()">${t('Voortgang wissen')}</button></div>
    <p class="hint" style="margin-top:14px">GameFlow v2</p>`;
}

/* ================= start ================= */
document.addEventListener('visibilitychange', () => { if (PET) { PET.last = Date.now(); savePet(); } });
applyTheme(); go('home'); initCloud();

</script>
</body></html>
