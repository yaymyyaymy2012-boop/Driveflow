<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DriveFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231cb0f6'/%3E%3Cpath d='M20 44a9 9 0 010-18 12 12 0 0123 2 8 8 0 01-1 16z' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<style>
:root, [data-theme="dark"] {
  --bg:#0b0f1a; --bg2:#121826; --bg3:#1a2235; --bg4:#2a3850;
  --card:#151d2e; --edge:#27334a;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --accent:#1cb0f6; --accent2:#4dc9ff; --accent-ink:#111;
  --accent-d:color-mix(in srgb, var(--accent) 62%, #000);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, transparent);
  --green:#58cc02; --red:#ff4b4b; --red-d:#c93a3a; --gold:#ffc800; --orange:#ff9600;
  --pop:0 4px 0 var(--edge);
  color-scheme:dark;
}
[data-theme="light"] {
  --bg:#f6f8fb; --bg2:#ffffff; --bg3:#eef2f7; --bg4:#e2e8f0;
  --card:#ffffff; --edge:#dde3ec;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  color-scheme:light;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; overscroll-behavior:none; }
button { font-family:inherit; font-weight:inherit; color:inherit; cursor:pointer; border:none; background:none; padding:0; }
input { font-family:inherit; font-weight:800; }
.hidden { display:none !important; }
#app { position:fixed; inset:0; display:flex; flex-direction:column; max-width:640px; margin:0 auto; background:var(--bg); }
.screen { display:none; flex:1; min-height:0; flex-direction:column; }
.screen.active { display:flex; }
.scroll { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 130px; -webkit-overflow-scrolling:touch; }
.hdr { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(env(safe-area-inset-top) + 16px) 16px 10px; }
.hdr h1 { margin:0; font-size:1.7rem; font-weight:900; letter-spacing:-.02em; line-height:1.1; }
.hdr .sub { color:var(--text2); font-size:.84rem; font-weight:800; margin-top:3px; }
.hdr-btns { display:flex; gap:8px; }
.icon-btn { width:44px; height:44px; border-radius:15px; background:var(--card); border:2px solid var(--edge); box-shadow:var(--pop); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .08s, box-shadow .08s; }
.icon-btn:active { transform:translateY(4px); box-shadow:0 0 0 var(--edge); }
.icon-btn.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-d); }
.icon-btn svg, .ic svg { width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.card { background:var(--card); border:2px solid var(--edge); box-shadow:var(--pop); border-radius:20px; padding:14px 16px; margin-bottom:14px; }
.card.press { cursor:pointer; transition:transform .08s, box-shadow .08s, border-color .15s; }
.card.press:active { transform:translateY(4px); box-shadow:0 0 0 var(--edge); border-color:var(--accent); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:16px; font-weight:900; letter-spacing:.05em; text-transform:uppercase; font-size:.82rem; padding:14px 18px; transition:transform .08s, box-shadow .08s; user-select:none; }
.btn:active { transform:translateY(4px); }
.btn-block { width:100%; }
.btn-primary { background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 0 var(--accent-d); }
.btn-primary:active { box-shadow:0 0 0 var(--accent-d); }
.btn-secondary { background:var(--card); color:var(--text); border:2px solid var(--edge); box-shadow:0 4px 0 var(--edge); }
.btn-secondary:active { box-shadow:0 0 0 var(--edge); }
.btn-red { background:var(--red); color:#fff; box-shadow:0 4px 0 var(--red-d); }
.btn-red:active { box-shadow:0 0 0 var(--red-d); }
.btn-sm { padding:10px 14px; font-size:.72rem; border-radius:14px; }
.btn:disabled { background:var(--bg4) !important; color:var(--text3) !important; box-shadow:0 4px 0 var(--edge) !important; }
.row2 { display:flex; gap:10px; } .row2 .btn { flex:1; }
.stack { display:flex; flex-direction:column; gap:10px; }

/* chips */
.chiprow { display:flex; gap:8px; padding:2px 16px 12px; overflow-x:auto; scrollbar-width:none; }
.chiprow::-webkit-scrollbar { display:none; }
.chipb { padding:9px 14px; border-radius:14px; background:var(--card); border:2px solid var(--edge); box-shadow:0 3px 0 var(--edge); font-size:.8rem; font-weight:900; color:var(--text2); white-space:nowrap; flex-shrink:0; }
.chipb:active { transform:translateY(3px); box-shadow:none; }
.chipb.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-d); }
.search { margin:0 16px 12px; display:flex; }
.search input { flex:1; background:var(--card); color:var(--text); border:2px solid var(--edge); border-radius:14px; padding:12px 14px; font-size:.95rem; outline:none; }
.search input:focus { border-color:var(--accent); }

/* grid */
.gh { margin:14px 2px 8px; color:var(--text2); font-size:.74rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
.gg { display:grid; grid-template-columns:repeat(var(--cols,3), 1fr); gap:5px; }
.tile { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--bg3); border:2px solid var(--edge); padding:0; transition:transform .08s; }
.tile:active { transform:scale(.95); }
.tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.tile .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text3); font-size:1.5rem; }
.tile .bd { position:absolute; display:flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:8px; background:rgba(0,0,0,.55); color:#fff; font-size:.7rem; font-weight:900; }
.tile .bd svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.tile .b-cloud { right:5px; bottom:5px; }
.tile .b-cloud.synced { color:var(--accent); } .tile .b-cloud.pending { color:var(--gold); } .tile .b-cloud.error { color:var(--red); }
.tile .b-fav { left:5px; bottom:5px; color:var(--gold); }
.tile .b-vid { left:5px; top:5px; }
.tile .ph.fl { flex-direction:column; gap:2px; padding:6px; text-align:center; }
.tile .fi { font-size:1.6rem; line-height:1; }
.tile .fe { font-size:.72rem; font-weight:900; color:var(--accent); letter-spacing:.04em; }
.tile .fn { font-size:.6rem; font-weight:800; color:var(--text2); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile .chk { position:absolute; right:6px; top:6px; width:24px; height:24px; border-radius:50%; border:2.5px solid #fff; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; color:var(--accent-ink); font-weight:900; font-size:.8rem; }
.selmode .tile .chk { display:flex; }
.tile.sel { border-color:var(--accent); transform:scale(.93); }
.tile.sel .chk { background:var(--accent); border-color:var(--accent); }
.more { display:block; margin:16px auto 0; }
.empty { text-align:center; color:var(--text3); padding:56px 20px; font-weight:800; line-height:1.55; }
.empty b { display:block; font-size:2.6rem; margin-bottom:8px; }

/* albums */
.agrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.album { padding:0; overflow:hidden; text-align:left; margin:0; }
.album .cov { aspect-ratio:1.15; background:var(--bg3); display:flex; align-items:center; justify-content:center; color:var(--text3); font-size:2rem; overflow:hidden; }
.album .cov img { width:100%; height:100%; object-fit:cover; display:block; }
.album .at { padding:10px 12px 11px; } .album .an { font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.album .ac { color:var(--text2); font-size:.76rem; font-weight:800; margin-top:1px; }
.album.new .cov { background:var(--accent-soft); color:var(--accent); font-size:2.4rem; }

/* meters / lists */
.meter { height:14px; border-radius:99px; background:var(--bg4); overflow:hidden; margin:10px 0 6px; }
.meter i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s; min-width:4px; }
.meter i.warn { background:var(--orange); } .meter i.full { background:var(--red); }
.mt { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.mt b { font-size:1.35rem; font-weight:900; letter-spacing:-.02em; } .mt span { color:var(--text2); font-size:.8rem; font-weight:800; text-align:right; }
.kv { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:2px solid var(--bg3); }
.kv:last-child { border-bottom:none; } .kv .k { color:var(--text2); font-size:.86rem; font-weight:800; } .kv .v { font-weight:900; text-align:right; min-width:0; word-break:break-word; }
.sec { margin:18px 2px 8px; color:var(--text2); font-size:.74rem; font-weight:900; letter-spacing:.09em; text-transform:uppercase; }
.note { color:var(--text3); font-size:.78rem; font-weight:800; line-height:1.5; }
.pill { display:inline-block; padding:3px 10px; border-radius:99px; font-size:.7rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); }
.pill.red { background:color-mix(in srgb, var(--red) 18%, transparent); color:var(--red); }
.pill.gold { background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold); }

/* settings */
.swatches { display:flex; flex-wrap:wrap; gap:12px; padding:6px 0 4px; }
.sw { width:44px; height:44px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 2px var(--edge), 0 4px 0 var(--edge); position:relative; }
.sw:active { transform:translateY(3px); }
.sw.on { box-shadow:0 0 0 3px var(--text), 0 4px 0 var(--edge); }
.sw.on::after { content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#111; font-weight:900; font-size:1.15rem; }
.sw.custom { background:conic-gradient(#ff4b4b,#ffc800,#58cc02,#1cb0f6,#ce82ff,#ff4b4b); overflow:hidden; }
.sw.custom input { position:absolute; inset:-10px; width:70px; height:70px; opacity:0; cursor:pointer; }
.seg { display:flex; background:var(--bg3); border-radius:14px; padding:4px; gap:4px; }
.seg button { flex:1; padding:9px 6px; border-radius:11px; font-size:.78rem; font-weight:900; color:var(--text2); white-space:nowrap; }
.seg button.on { background:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-d); }
.set-row { padding:12px 0; border-bottom:2px solid var(--bg3); } .set-row:last-child { border-bottom:none; }
.set-row .sr-t { font-weight:900; margin-bottom:8px; } .set-row .sr-d { color:var(--text3); font-size:.76rem; font-weight:800; margin:-4px 0 8px; }
.set-row.inline { display:flex; align-items:center; justify-content:space-between; gap:12px; } .set-row.inline .sr-t { margin:0; }
.sw-switch { width:54px; height:32px; border-radius:99px; background:var(--bg4); position:relative; transition:background .15s; flex-shrink:0; }
.sw-switch::after { content:''; position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s; }
.sw-switch.on { background:var(--accent); } .sw-switch.on::after { transform:translateX(22px); }

/* nav + selection bar */
#nav, #selbar { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:640px; background:var(--bg2); border-top:2px solid var(--edge); padding:0 6px calc(env(safe-area-inset-bottom) + 6px); z-index:50; display:flex; align-items:flex-end; }
#selbar { z-index:60; align-items:center; gap:8px; padding-top:10px; display:none; }
#selbar.show { display:flex; }
#selbar .cnt { font-weight:900; padding:0 8px; white-space:nowrap; }
#selbar .sp { flex:1; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 4px; margin-top:6px; border-radius:16px; color:var(--text3); font-size:.62rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; border:2px solid transparent; }
.nav-item svg { width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; }
.nav-item.active { color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
.nav-item.center { margin-top:-18px; }
.nav-item.center .cbtn { width:62px; height:62px; border-radius:20px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 var(--accent-d); transition:transform .08s, box-shadow .08s; }
.nav-item.center .cbtn svg { width:30px; height:30px; stroke-width:3.2; }
.nav-item.center:active .cbtn { transform:translateY(4px); box-shadow:0 1px 0 var(--accent-d); }

/* sheet / toast / auth / viewer */
.ov { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; }
.ov.show { display:flex; }
.sheet { width:100%; max-width:640px; max-height:88vh; overflow-y:auto; background:var(--bg2); border:2px solid var(--edge); border-bottom:none; border-radius:26px 26px 0 0; padding:20px 18px calc(env(safe-area-inset-bottom) + 18px); animation:up .22s ease; }
@keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
.sheet h2 { margin:0 0 4px; font-size:1.25rem; font-weight:900; }
.sheet .sd { color:var(--text2); font-size:.86rem; font-weight:800; margin:0 0 14px; line-height:1.4; white-space:pre-line; }
.sheet input[type=text], .field { width:100%; background:var(--card); color:var(--text); border:2px solid var(--edge); border-radius:14px; padding:13px 14px; font-size:1rem; outline:none; margin-bottom:12px; }
.sheet input[type=text]:focus, .field:focus { border-color:var(--accent); }
.lbl { color:var(--text2); font-size:.72rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; margin:2px 0 8px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.prog { height:12px; border-radius:99px; background:var(--bg4); overflow:hidden; margin:12px 0 8px; } .prog i { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .15s; }
#toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 16px); transform:translate(-50%,-30px); opacity:0; pointer-events:none; background:var(--card); border:2px solid var(--edge); box-shadow:var(--pop); padding:11px 18px; border-radius:99px; font-weight:900; font-size:.86rem; z-index:400; transition:transform .2s, opacity .2s; max-width:90%; text-align:center; }
#toast.show { transform:translate(-50%,0); opacity:1; }
#auth { position:fixed; inset:0; z-index:300; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px; overflow-y:auto; }
#auth.show { display:flex; }
.auth-box { width:100%; max-width:380px; text-align:center; }
.logo { width:84px; height:84px; border-radius:26px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; box-shadow:0 6px 0 var(--accent-d); }
.logo svg { width:46px; height:46px; fill:currentColor; }
.auth-box h1 { margin:0 0 4px; font-size:2rem; font-weight:900; letter-spacing:-.02em; }
.auth-box p { margin:0 0 20px; color:var(--text2); font-size:.9rem; font-weight:800; line-height:1.4; }
.auth-err { min-height:1.3em; color:var(--red); font-size:.84rem; font-weight:800; margin-bottom:10px; }
#viewer { position:fixed; inset:0; z-index:150; background:#000; display:none; flex-direction:column; user-select:none; -webkit-user-select:none; }
#viewer.show { display:flex; }
.vtop, .vbot { position:absolute; left:0; right:0; display:flex; align-items:center; gap:10px; padding:12px 14px; z-index:3; transition:opacity .2s; }
.vtop { top:0; padding-top:calc(env(safe-area-inset-top) + 12px); background:linear-gradient(rgba(0,0,0,.7), transparent); }
.vbot { bottom:0; padding-bottom:calc(env(safe-area-inset-bottom) + 14px); background:linear-gradient(transparent, rgba(0,0,0,.75)); justify-content:space-around; }
#viewer.bare .vtop, #viewer.bare .vbot { opacity:0; pointer-events:none; }
.vbtn { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; }
.vbtn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.vbtn.on { color:var(--gold); } .vbtn.on svg { fill:currentColor; }
.vtitle { flex:1; min-width:0; color:#fff; } .vtitle b { display:block; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .vtitle span { font-size:.76rem; color:#cbd5e1; font-weight:800; }
#vstage { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
#vstage img, #vstage video { max-width:100%; max-height:100%; object-fit:contain; transition:transform .2s; transform-origin:center; }
.vspin { position:absolute; color:#fff; font-weight:900; z-index:2; }
</style>
</head>
<body>
<div id="app">
  <!-- FOTO'S -->
  <section class="screen active" id="s-photos">
    <div class="hdr">
      <div><h1 id="p-title">Drive</h1><div class="sub" id="p-sub"></div></div>
      <div class="hdr-btns">
        <button class="icon-btn" id="b-search" onclick="toggleSearch()" aria-label="Zoeken"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span></button>
        <button class="icon-btn" id="b-select" onclick="toggleSelect()" aria-label="Selecteren"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5-6"/></svg></span></button>
      </div>
    </div>
    <div class="search hidden" id="searchbar"><input type="text" id="q" placeholder="Zoek op naam…" autocomplete="off"></div>
    <div class="chiprow" id="chips"></div>
    <div class="scroll" id="grid"></div>
  </section>

  <!-- ALBUMS -->
  <section class="screen" id="s-albums">
    <div class="hdr"><div><h1>Albums</h1><div class="sub" id="a-sub"></div></div></div>
    <div class="scroll" id="albums-body"></div>
  </section>

  <!-- CLOUD -->
  <section class="screen" id="s-cloud">
    <div class="hdr"><div><h1>Cloud</h1><div class="sub" id="c-sub"></div></div><button class="icon-btn" onclick="refreshCloud()" aria-label="Verversen"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></span></button></div>
    <div class="scroll" id="cloud-body"></div>
  </section>

  <!-- OPTIES -->
  <section class="screen" id="s-set">
    <div class="hdr"><div><h1>Opties</h1></div></div>
    <div class="scroll" id="set-body"></div>
  </section>

  <nav id="nav">
    <button class="nav-item active" data-s="photos" onclick="show('photos')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg><span>Foto’s</span></button>
    <button class="nav-item" data-s="albums" onclick="show('albums')"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>Albums</span></button>
    <button class="nav-item center" onclick="openUpload()"><div class="cbtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><span style="color:var(--text3)">Upload</span></button>
    <button class="nav-item" data-s="cloud" onclick="show('cloud')"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 010-9 6 6 0 0111.5 1.6A3.7 3.7 0 0118 18z"/></svg><span>Cloud</span></button>

}

/* ============================ local database (IndexedDB) ============================ */
let DBH = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('driveflow', 1);

  });
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbStore = (n, m) => DBH.transaction(n, m || 'readonly').objectStore(n);
const dbAll = n => rq(dbStore(n).getAll());

const dbPut = (n, v) => rq(dbStore(n, 'readwrite').put(v));

const ITEMS = new Map();       // id -> item (metadata + small thumbnail)

const saveAlbums = () => lsSet('df_albums', ALBUMS);
const saveItem = it => dbPut('items', it).catch(e => console.warn('save item', e));

/* ============================ navigation / state ============================ */

  document.querySelectorAll('.nav-item[data-s]').forEach(n => n.classList.toggle('active', n.dataset.s === name));
  if (name === 'photos') renderPhotos(); if (name === 'albums') renderAlbums(); if (name === 'cloud') renderCloud(); if (name === 'set') renderSettings();
}

/* ============================ photos screen ============================ */
function visible() {
  let a = [...ITEMS.values()];
  if (F.kind !== 'all') a = a.filter(i => i.kind === F.kind);

  if (F.q) { const q = F.q.toLowerCase(); a = a.filter(i => i.name.toLowerCase().includes(q)); }

}

  const d = new Date(ts), n = new Date(), d0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();

}
let GRID_LIMIT = 240, VIEW = [];
const CLOUD_IC = { synced: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', pending: '<svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg>', error: '<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg>' };

  const al = ALBUMS.filter(a => !a.deleted).find(a => a.id === F.album);

  $('chips').innerHTML = c(F.kind === 'all' && !F.fav, 'Alles', "setFilter('all')") + c(F.fav, '★ Favorieten', 'setFilter(\'fav\')') + c(F.kind === 'image', 'Foto’s', "setFilter('image')") + c(F.kind === 'video', 'Video’s', "setFilter('video')") + c(F.kind === 'file', 'Bestanden', "setFilter('file')") + (al ? c(true, '▣ ' + esc(al.name) + ' ✕', "setAlbumFilter('')") : '');
}
function setFilter(k) { if (k === 'fav') { F.fav = !F.fav; } else { F.kind = k; F.fav = false; } GRID_LIMIT = 240; renderPhotos(); }
function setAlbumFilter(id) { F.album = id; GRID_LIMIT = 240; if (cur !== 'photos') show('photos'); else renderPhotos(); }
function toggleSearch() { const b = $('searchbar'); b.classList.toggle('hidden'); $('b-search').classList.toggle('on', !b.classList.contains('hidden')); if (b.classList.contains('hidden')) { F.q = ''; $('q').value = ''; renderPhotos(); } else $('q').focus(); }
$('q').addEventListener('input', e => { F.q = e.target.value.trim(); GRID_LIMIT = 240; renderPhotos(); });

  $('p-sub').textContent = SYNC.running ? `☁ Synchroniseren ${SYNC.done}/${SYNC.total}…` : `${n} ${n === 1 ? 'item' : 'items'} · ${fmtBytes(size)} op dit toestel`;

  });

/* tile interaction: tap = open / toggle, long press = select */
(function () {
  const g = $('grid'); let timer = null, long = false, sx = 0, sy = 0;
  const tileOf = e => e.target.closest && e.target.closest('.tile');
  g.addEventListener('touchstart', e => { const t = tileOf(e); if (!t) return; long = false; sx = e.touches[0].clientX; sy = e.touches[0].clientY; timer = setTimeout(() => { long = true; if (!selMode) toggleSelect(true); toggleSel(t.dataset.id); if (navigator.vibrate) try { navigator.vibrate(12); } catch (x) {} }, 480); }, { passive: true });
  g.addEventListener('touchmove', e => { if (Math.abs(e.touches[0].clientX - sx) > 8 || Math.abs(e.touches[0].clientY - sy) > 8) clearTimeout(timer); }, { passive: true });

  g.addEventListener('click', e => { const t = tileOf(e); if (!t) return; if (long) { long = false; return; } if (selMode) toggleSel(t.dataset.id); else openViewer(t.dataset.id); });
})();
function toggleSelect(on) {
  selMode = on === undefined ? !selMode : !!on; if (!selMode) SEL.clear();
  $('selbar').classList.toggle('show', selMode); $('b-select').classList.toggle('on', selMode); $('grid').classList.toggle('selmode', selMode); $('sel-cnt').textContent = SEL.size; renderPhotos();
}
function toggleSel(id) {

  const t = $('grid').querySelector(`.tile[data-id="${id}"]`); if (t) t.classList.toggle('sel', SEL.has(id)); $('sel-cnt').textContent = SEL.size;
}
async function selAction(a) {
  const ids = [...SEL]; if (!ids.length) { toast('Selecteer eerst iets'); return; }
  if (a === 'sync') { syncQueue(ids, true); toggleSelect(false); }
  if (a === 'fav') { const all = ids.every(i => ITEMS.get(i).fav); ids.forEach(i => setFav(i, !all)); toggleSelect(false); }
  if (a === 'album') { const id = await pickAlbum(); if (id !== undefined) { ids.forEach(i => setAlbum(i, id)); toggleSelect(false); toast('Verplaatst'); } }
  if (a === 'del') { if (await deleteFlow(ids)) toggleSelect(false); }

/* ============================ file add / upload ============================ */
function openUpload() {
  openSheet(`<h2>Toevoegen</h2><p class="sd">Foto’s, video’s en bestanden worden op dit toestel bewaard${CLOUD.uid ? '; foto’s en kleine bestanden (tot 850 KB) gaan daarna naar je cloud.' : '. Log in via het Cloud-tabblad om ze ook op andere apparaten te zien.'}</p>
    <div class="stack"><button class="btn btn-primary btn-block" onclick="closeSheet();$('f-pick').click()">🖼️ Foto’s / video’s kiezen</button><button class="btn btn-secondary btn-block" onclick="closeSheet();$('f-any').click()">📁 Bestanden (downloads, apk, pdf…)</button><button class="btn btn-secondary btn-block" onclick="closeSheet();$('f-cam').click()">📷 Camera</button><button class="btn btn-secondary btn-block" onclick="closeSheet()">Annuleren</button></div>`);
}
$('f-pick').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });

document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files], true); });

function imgInfo(file) {
  return createImageBitmap(file, { imageOrientation: 'from-image' }).then(bmp => {
    const sc = Math.min(1, 220 / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const out = { thumb: c.toDataURL('image/jpeg', .65), w: bmp.width, h: bmp.height }; if (bmp.close) bmp.close(); return out;
  }).catch(() => ({ thumb: null, w: 0, h: 0, bad: true }));
}
function videoInfo(file) {
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(file); let fin = false;
    const done = o => { if (fin) return; fin = true; URL.revokeObjectURL(url); res(o); };

    v.onerror = () => done({ thumb: null, w: 0, h: 0 }); setTimeout(() => done({ thumb: null, w: 0, h: 0 }), 7000);
  });
}

}

    for (let qq = q; qq >= .4; qq -= .1) { out = await new Promise(r => c.toBlob(r, 'image/jpeg', qq)); if (out && out.size <= MAXDOC) { if (bmp.close) bmp.close(); return out; } }
    sc *= .8;
  }
  if (bmp.close) bmp.close(); if (out && out.size <= 1000 * 1024) return out; throw new Error('te groot');
}

  else { const qs = QUAL[S.quality]; c = await compressForCloud(b.blob, qs.dim, qs.q); }

    for (const d of snap.docs) {
      const r = d.data(), id = d.id; let it = ITEMS.get(id); maxTs = Math.max(maxTs, r.updatedAt || 0);
      if (!it) { it = { id, key: 'cloud|' + id, name: r.name || 'foto.jpg', mime: r.mime || 'image/jpeg', size: r.size || r.cloudSize || 0, date: r.date || r.created || Date.now(), added: r.created || Date.now(), w: r.w || 0, h: r.h || 0, thumb: r.thumb || null, kind: r.kind === 'file' ? 'file' : 'image', album: r.album || '', fav: !!r.fav, hasBlob: false, cloud: 'synced', cloudSize: r.cloudSize || 0, updatedAt: r.updatedAt || 0 }; ITEMS.set(id, it); await saveItem(it); changed = true; }
      else if ((r.updatedAt || 0) > (it.updatedAt || 0)) { it.fav = !!r.fav; it.album = r.album || ''; it.name = r.name || it.name; it.cloud = 'synced'; it.cloudSize = r.cloudSize || it.cloudSize; it.updatedAt = r.updatedAt; await saveItem(it); changed = true; }
    }
    localStorage.setItem(key, String(maxTs));
    const tr = await base.collection('driveTrash').where('at', '>', lastT).get(); let maxT = lastT;
    for (const d of tr.docs) { maxT = Math.max(maxT, d.data().at || 0); const it = ITEMS.get(d.id); if (it) { ITEMS.delete(d.id); await dbDel('blobs', d.id).catch(() => {}); await dbDel('items', d.id).catch(() => {}); changed = true; } }
    localStorage.setItem(tkey, String(maxT));
    const al = await base.collection('driveAlbums').get();
    al.forEach(d => { const r = d.data(), ex = ALBUMS.find(a => a.id === d.id); if (!ex) ALBUMS.push({ id: d.id, name: r.name, created: r.created || 0, deleted: !!r.deleted, at: r.at || 0 }); else if ((r.at || 0) > (ex.at || 0)) { ex.name = r.name; ex.deleted = !!r.deleted; ex.at = r.at; } });
    saveAlbums(); CLOUD.lastPull = Date.now();
    renderPhotos(); if (cur === 'albums') renderAlbums(); if (cur === 'cloud') renderCloud();
  } catch (e) { console.warn('pull', e); if (/permission/i.test(String(e && e.message))) CLOUD.rulesErr = true; }
}
function pushMeta(it) { if (!CLOUD.uid || it.cloud !== 'synced') return; fsBase().collection('drive').doc(it.id).update({ fav: !!it.fav, album: it.album || '', name: it.name, updatedAt: it.updatedAt }).catch(() => {}); }
function pushAlbum(a) { a.at = Date.now(); saveAlbums(); if (!CLOUD.uid) return; fsBase().collection('driveAlbums').doc(a.id).set({ name: a.name, created: a.created, deleted: !!a.deleted, at: a.at }).catch(() => {}); }
async function refreshCloud() { if (!CLOUD.uid) { toast('Log eerst in'); showAuth(); return; } toast('Verversen…'); await pullCloud(true); toast('Bijgewerkt'); }

/* ---- own Firebase project (setup) ---- */
const RULES_TXT = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}";
function openCloudSetup() {
  const has = !!FIREBASE_CONFIG;
  openSheet(`<h2>Eigen cloud-project</h2><p class="sd">DriveFlow gebruikt een apart, gratis Firebase-project. Zo kunnen je foto’s de opslag van StudyFlow nooit vol maken.</p>
    <div class="lbl">Eenmalig instellen</div>
    <p class="note" style="margin:0 0 12px;line-height:1.7">1. Ga naar console.firebase.google.com → <b>Project toevoegen</b> (naam bijv. “driveflow”).<br>2. <b>Build → Authentication</b> → Aan de slag → zet <b>E-mail/wachtwoord</b> aan.<br>3. <b>Build → Firestore Database</b> → Database maken → tab <b>Rules</b> → plak de regels hieronder → Publish.<br>4. <b>Projectinstellingen → Je apps → Web (&lt;/&gt;)</b> → registreer → kopieer het <b>firebaseConfig</b>-blok en plak het hier.</p>
    <button class="btn btn-secondary btn-block btn-sm" id="cs-rules" style="margin-bottom:12px">Firestore-regels kopiëren</button>
    <textarea id="cs-cfg" class="field" style="height:140px;font-size:.72rem;font-family:ui-monospace,Menlo,monospace;resize:none" placeholder='const firebaseConfig = {&#10;  apiKey: "…",&#10;  authDomain: "…",&#10;  projectId: "…",&#10;  …&#10;};'></textarea>
    <div class="auth-err" id="cs-err"></div>
    <div class="row2"><button class="btn btn-secondary" onclick="closeSheet()">Sluiten</button><button class="btn btn-primary" id="cs-save">Opslaan</button></div>
    ${has ? `<button class="btn btn-red btn-block btn-sm" id="cs-clear" style="margin-top:10px">Cloud-project loskoppelen</button><p class="note" style="margin-top:8px">Nu gekoppeld: ${esc(FIREBASE_CONFIG.projectId)}</p>` : ''}`);
  $('cs-rules').onclick = async () => { try { await navigator.clipboard.writeText(RULES_TXT); toast('Regels gekopieerd'); } catch (e) { $('cs-cfg').value = RULES_TXT; toast('Kopieer de regels uit het vak'); } };
  $('cs-save').onclick = () => {
    const txt = $('cs-cfg').value, cfg = {}; let m; const re = /["']?([A-Za-z]+)["']?\s*:\s*["']([^"']+)["']/g;
    while ((m = re.exec(txt))) cfg[m[1]] = m[2];
    if (!cfg.apiKey || !cfg.projectId || !cfg.appId) { $('cs-err').textContent = 'Ik vind apiKey, projectId en appId niet. Plak het hele firebaseConfig-blok.'; return; }
    if (cfg.projectId === STUDYFLOW_PROJECT) { $('cs-err').textContent = 'Dit is het StudyFlow-project. Maak een nieuw, apart project.'; return; }
    if (!cfg.authDomain) cfg.authDomain = cfg.projectId + '.firebaseapp.com';
    const keep = {}; ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(k => { if (cfg[k]) keep[k] = cfg[k]; });
    lsSet('df_fbconfig', keep); lsSet('df_local', false); location.reload();
  };
  if (has) $('cs-clear').onclick = async () => { if (await confirmSheet('Loskoppelen?', 'Je foto’s op dit toestel blijven bewaard. De cloud-foto’s blijven in je project staan.', 'Loskoppelen')) { try { localStorage.removeItem('df_fbconfig'); } catch (e) {} location.reload(); } };
}

/* ---- auth ---- */
function showAuth() { $('auth').classList.add('show'); $('au-err').textContent = ''; }
function hideAuth() { $('auth').classList.remove('show'); }
function goLocal() { lsSet('df_local', true); hideAuth(); }
function authErr(e) {
  const c = (e && e.code) || '';
  if (/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c)) return 'Naam of wachtwoord klopt niet.';
  if (/email-already-in-use/.test(c)) return 'Deze naam bestaat al — log in.';
  if (/weak-password/.test(c)) return 'Wachtwoord moet minstens 6 tekens zijn.';
  if (/network/.test(c)) return 'Geen verbinding.';
  if (/too-many/.test(c)) return 'Te veel pogingen. Wacht even.';
  if (/operation-not-allowed/.test(c)) return 'Inloggen met naam is niet aangezet in Firebase.';
  return 'Er ging iets mis' + (c ? ' (' + c.replace('auth/', '') + ')' : '') + '.';
}
async function doAuth(register) {
  const name = $('au-name').value.trim(), pw = $('au-pw').value;
  if (!CLOUD.available) { $('au-err').textContent = 'Cloud is niet beschikbaar (geen internet?).'; return; }
  if (!/[a-z0-9]/i.test(name)) { $('au-err').textContent = 'Vul een gebruikersnaam in.'; return; }
  if (!pw) { $('au-err').textContent = 'Vul je wachtwoord in.'; return; }
  $('au-login').disabled = $('au-reg').disabled = true; $('au-err').textContent = '';
  try {
    if (register) await firebase.auth().createUserWithEmailAndPassword(userToEmail(name), pw);
    else await firebase.auth().signInWithEmailAndPassword(userToEmail(name), pw);
    $('au-pw').value = ''; lsSet('df_local', false); hideAuth();
  } catch (e) { $('au-err').textContent = authErr(e); }
  $('au-login').disabled = $('au-reg').disabled = false;
}
$('au-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(false); });
async function logout() { if (!(await confirmSheet('Uitloggen?', 'Je foto’s op dit toestel blijven bewaard.', 'Uitloggen', false))) return; try { await firebase.auth().signOut(); } catch (e) {} }
function initCloud() {
  if (!FIREBASE_CONFIG) { CLOUD.available = false; CLOUD.noConfig = true; CLOUD.ready = true; return; }
  CLOUD.available = typeof firebase !== 'undefined';
  if (!CLOUD.available) { CLOUD.ready = true; if (!lsGet('df_local', false)) { $('auth-p').textContent = 'Cloud is nu niet bereikbaar. Je kunt wel zonder account verder; foto’s blijven op deze telefoon.'; showAuth(); } return; }
  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } catch (e) { CLOUD.available = false; showAuth(); return; }
  let first = true;
  firebase.auth().onAuthStateChanged(async user => {
    CLOUD.ready = true;
    if (user) { CLOUD.uid = user.uid; CLOUD.name = (user.email || '').split('@')[0]; hideAuth(); await pullCloud(false); if (cur === 'cloud') renderCloud(); if (S.autoSync && canAutoSync()) syncQueue([...ITEMS.keys()]); }
    else { CLOUD.uid = null; CLOUD.name = ''; if (!lsGet('df_local', false)) showAuth(); if (cur === 'cloud') renderCloud(); }
    first = false;
  });
  window.addEventListener('online', () => { if (CLOUD.uid && S.autoSync && canAutoSync()) { pullCloud(false); syncQueue([...ITEMS.keys()]); } });
}
function cloudUsed() { let n = 0, c = 0; ITEMS.forEach(i => { if (i.cloud === 'synced') { n++; c += (i.cloudSize || 0) + (i.thumb ? i.thumb.length : 0); } }); return { n, bytes: c }; }
async function renderCloud() {
  const cu = cloudUsed(), limit = S.cloudGB * 1073741824, pct = Math.min(100, cu.bytes / limit * 100);
  const cnt = { synced: 0, pending: 0, error: 0, local: 0, video: 0, cloudOnly: 0 }; ITEMS.forEach(i => { if (i.cloud === 'synced') cnt.synced++; else if (i.cloud === 'pending') cnt.pending++; else if (i.cloud === 'error') cnt.error++; else if (i.kind === 'video') cnt.video++; else cnt.local++; if (!i.hasBlob) cnt.cloudOnly++; });
  const si = await storageInfo(); let libSize = 0; ITEMS.forEach(i => { if (i.hasBlob) libSize += i.size || 0; });
  $('c-sub').textContent = CLOUD.uid ? 'Verbonden als ' + CLOUD.name : (CLOUD.available ? 'Niet ingelogd' : 'Cloud niet beschikbaar');
  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const devPct = si && si.quota ? Math.min(100, si.usage / si.quota * 100) : 0;
  $('cloud-body').innerHTML = `
    ${`<div class="card"><div class="mt"><b>${CLOUD.uid ? esc(CLOUD.name) : 'Geen account'}</b><span>${CLOUD.uid ? '<span class="pill">Verbonden</span>' : '<span class="pill red">Niet ingelogd</span>'}</span></div>
      <p class="note" style="margin:8px 0 12px">${CLOUD.uid ? 'Foto’s die je uploadt komen op elk apparaat waar je met dit account inlogt.' : 'Log in of maak een account om foto’s op al je apparaten te zien.'}</p>
      ${CLOUD.uid ? '<button class="btn btn-secondary btn-block btn-sm" onclick="logout()">Uitloggen</button>' : '<button class="btn btn-primary btn-block" onclick="showAuth()">Inloggen / account maken</button>'}</div>`}
    <div class="sec">Cloud-opslag</div><div class="card">
      <div class="mt"><b>${fmtBytes(cu.bytes)}</b><span>van ${S.cloudGB >= 1000 ? (S.cloudGB / 1000) + ' TB' : S.cloudGB + ' GB'} (${pct.toFixed(1)}%)</span></div>
      <div class="meter"><i class="${pct > 95 ? 'full' : pct > 80 ? 'warn' : ''}" style="width:${pct}%"></i></div>
      ${kv('In cloud', cu.n + ' foto’s')}${kv('Wacht op upload', cnt.pending + (cnt.error ? ' (+' + cnt.error + ' mislukt)' : ''))}${kv('Alleen op toestel', (cnt.local + cnt.video) + (cnt.video ? ' (' + cnt.video + ' video’s)' : ''))}${kv('Alleen in cloud', cnt.cloudOnly)}
      ${SYNC.running ? `<div class="prog"><i style="width:${Math.round(SYNC.done / Math.max(1, SYNC.total) * 100)}%"></i></div><p class="note">Synchroniseren ${SYNC.done}/${SYNC.total}…</p>` : ''}
      ${CLOUD.rulesErr ? '<p class="note" style="color:var(--red)">Firestore weigert schrijven. De cloud-regels staan nog op “geweigerd”; publiceer ze één keer in de Firebase-console.</p>' : ''}
      ${CLOUD.quotaErr ? '<p class="note" style="color:var(--red)">De gratis Firestore-limiet is bereikt. Ruim foto’s op of upgrade je Firebase-plan.</p>' : ''}
    </div>
    <div class="sec">Op dit toestel</div><div class="card">
      <div class="mt"><b>${fmtBytes(libSize)}</b><span>${si && si.quota ? 'ruimte voor DriveFlow: ' + fmtBytes(si.quota) : 'limiet onbekend'}</span></div>
      <div class="meter"><i class="${devPct > 95 ? 'full' : devPct > 80 ? 'warn' : ''}" style="width:${devPct}%"></i></div>
      <p class="note">De limiet is wat je browser/telefoon voor deze app toestaat — meestal een groot deel van je vrije opslag.</p></div>
    <div class="stack"><button class="btn btn-primary btn-block" onclick="syncQueue([...ITEMS.keys()],true)">☁ Alles synchroniseren</button><button class="btn btn-secondary btn-block" onclick="refreshCloud()">↻ Cloud verversen</button><button class="btn btn-secondary btn-block" onclick="freeSpace()">Ruimte vrijmaken</button></div>
    <p class="note" style="margin-top:14px">De cloud-kopie is een verkleinde JPEG (${QUAL[S.quality].dim}px) zodat 1 foto in 1 Firestore-document past. Originelen blijven op het toestel waar je ze toevoegde. De gratis Firestore-limiet is 1 GB totaal, alleen voor dit eigen project.</p>`;
}
async function freeSpace() {
  const items = [...ITEMS.values()].filter(i => i.cloud === 'synced' && i.hasBlob); if (!items.length) { toast('Niks om vrij te maken'); return; }
  const size = items.reduce((a, i) => a + (i.size || 0), 0);
  if (await confirmSheet('Ruimte vrijmaken?', `${items.length} originelen (${fmtBytes(size)}) worden van dit toestel gehaald. Je houdt alleen de cloud-versie (max ${QUAL[S.quality].dim}px). Dit kan niet ongedaan worden.`, 'Vrijmaken')) { await freeLocal(items); renderCloud(); }
}

/* ============================ settings ============================ */
function seg(id, opts, val) { return `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(val) === String(v) ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>`; }
function tgl(id, label, on, d) { return `<div class="set-row inline"><div><div class="sr-t">${esc(label)}</div>${d ? `<div class="sr-d" style="margin:2px 0 0">${esc(d)}</div>` : ''}</div><button class="sw-switch ${on ? 'on' : ''}" id="${id}" aria-label="${esc(label)}"></button></div>`; }
function renderSettings() {
  const isPre = PRESETS.some(c => c.toLowerCase() === S.accent.toLowerCase());
  $('set-body').innerHTML = `
    <div class="sec">Uiterlijk</div><div class="card">
      <div class="set-row"><div class="sr-t">Kleur</div><div class="sr-d">Kies een kleur of maak je eigen kleur.</div><div class="swatches">${PRESETS.map(c => `<button class="sw ${c.toLowerCase() === S.accent.toLowerCase() ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('')}<div class="sw custom ${!isPre ? 'on' : ''}" ${!isPre ? `style="background:${S.accent}"` : ''}><input type="color" id="accent-pick" value="${S.accent}"></div></div></div>
      <div class="set-row"><div class="sr-t">Thema</div>${seg('sg-theme', [['dark', '☾ Donker'], ['light', '☀ Licht']], S.theme)}</div>
      <div class="set-row"><div class="sr-t">Foto’s per rij</div>${seg('sg-cols', [[2, '2'], [3, '3'], [4, '4'], [5, '5']], S.cols)}</div>
    </div>
    <div class="sec">Cloud</div><div class="card">
      ${tgl('tg-auto', 'Automatisch uploaden', S.autoSync, 'Nieuwe foto’s direct naar je cloud')}
      ${NATIVE ? tgl('tg-import', 'Foto’s uit galerij oppakken', S.autoImport, 'Nieuwe foto’s van je telefoon automatisch toevoegen en uploaden') + `<div class="set-row"><button class="btn btn-secondary btn-block btn-sm" id="bt-import">Alle foto’s uit galerij importeren</button></div>` : ''}
      ${tgl('tg-wifi', 'Alleen via wifi', S.wifiOnly, 'Niet uploaden via mobiele data (als je telefoon dat doorgeeft)')}
      <div class="set-row"><div class="sr-t">Kwaliteit in cloud</div><div class="sr-d">Hoger = scherper, maar minder foto’s in je gratis ruimte.</div>${seg('sg-q', [['high', 'Hoog'], ['normal', 'Normaal'], ['small', 'Zuinig']], S.quality)}</div>
      <div class="set-row"><div class="sr-t">Cloud-limiet (weergave)</div><div class="sr-d">Gratis Firestore = 1 GB. Zet hoger als je je Firebase-plan hebt opgewaardeerd.</div>${seg('sg-gb', [[1, '1 GB'], [10, '10 GB'], [100, '100 GB'], [1024, '1 TB']], S.cloudGB)}</div>
    </div>
    <p class="note">DriveFlow bewaart originelen in de opslag van deze app op je toestel. Foto’s in de cloud staan in je eigen Firebase-project, los van StudyFlow.</p>`;
  const root = $('set-body');
  root.querySelectorAll('.sw[data-c]').forEach(b => b.onclick = () => { applyAccent(b.dataset.c); saveS(); renderSettings(); });
  const pick = $('accent-pick'); pick.oninput = () => { applyAccent(pick.value); saveS(); root.querySelectorAll('.sw').forEach(s => s.classList.remove('on')); const c = pick.parentNode; c.classList.add('on'); c.style.background = pick.value; };
  const bind = (id, fn) => root.querySelectorAll('#' + id + ' button').forEach(b => b.onclick = () => { fn(b.dataset.v); saveS(); renderSettings(); });
  bind('sg-theme', v => applyTheme(v)); bind('sg-cols', v => { S.cols = +v; applyCols(); }); bind('sg-q', v => S.quality = v); bind('sg-gb', v => S.cloudGB = +v);
  const t = (id, k) => $(id).onclick = () => { S[k] = !S[k]; saveS(); renderSettings(); }; t('tg-auto', 'autoSync'); t('tg-wifi', 'wifiOnly'); if (NATIVE) { t('tg-import', 'autoImport'); $('bt-import').onclick = () => scanGallery({ force: true, all: true }); }
}

/* ============================ init ============================ */
async function init() {
  applyTheme(S.theme); applyAccent(S.accent); applyCols();
  try { DBH = await openDB(); (await dbAll('items')).forEach(i => ITEMS.set(i.id, i)); } catch (e) { toast('Opslag niet beschikbaar in deze browser'); console.warn(e); }
  renderPhotos(); initCloud();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
/* ============================ native galerij auto-import (Android-app) ============================ */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
function mediaPlugin() { try { const C = window.Capacitor; if (!C) return null; if (C.Plugins && C.Plugins.Gallery) return C.Plugins.Gallery; if (C.registerPlugin) return C.registerPlugin('Gallery'); } catch (e) {} return null; }
let SCANNING = false;
function dbgSheet(title, info) { openSheet('<h2>' + esc(title) + '</h2><p class="sd" style="white-space:pre-wrap;word-break:break-all;font-size:.74rem">' + esc(info) + '</p><button class="btn btn-secondary btn-block" onclick="closeSheet()">Sluiten</button>'); }
async function scanGallery(opts) {
  opts = opts || {}; const G = mediaPlugin();
  if (!NATIVE || SCANNING || ADDING) return;
  if (!G) { if (opts.force) dbgSheet('Galerij-plugin ontbreekt', 'Plugins: ' + Object.keys((window.Capacitor && Capacitor.Plugins) || {}).join(', ') + ' | convertFileSrc: ' + !!(window.Capacitor && Capacitor.convertFileSrc)); return; }
  if (!opts.force && !S.autoImport) return;
  SCANNING = true; let stage = 'start';
  try {
    stage = 'rechten';
    const perm = await G.ensurePermission();
    if (!perm || !perm.granted) { if (opts.force) toast('Geef toegang tot foto’s in de Android-instellingen'); return; }
    let since = Number(localStorage.getItem('df_auto_since') || 0);
    if (!since) { since = Date.now(); localStorage.setItem('df_auto_since', String(since)); }
    const seen = new Set(lsGet('df_seen_media', []));
    stage = 'lijst';
    const res = await G.list({ limit: opts.all ? 1000 : 60, since: opts.all ? 0 : since });
    const list = ((res && res.items) || []).filter(m => !seen.has('g' + m.id));
    if (!list.length) { if (opts.force) toast('Geen nieuwe foto’s gevonden'); return; }
    let lastErr = '', done = 0;
    for (let i = 0; i < list.length; i += 15) {
      const files = [];
      for (const m of list.slice(i, i + 15)) {
        try {
          stage = 'kopiëren';
          const r = await G.copy({ id: m.id });
          stage = 'lezen';
          const resp = await fetch(Capacitor.convertFileSrc(r.path)); if (!resp.ok) throw new Error('fetch ' + resp.status);
          const blob = await resp.blob();
          files.push(new File([blob], m.name || ('foto-' + m.id + '.jpg'), { type: blob.type || 'image/jpeg', lastModified: m.date || Date.now() }));
          seen.add('g' + m.id);
        } catch (e) { lastErr = stage + ': ' + (e && e.message || e); console.warn('media', e); }
      }
      lsSet('df_seen_media', [...seen].slice(-6000));
      if (files.length) { await addFiles(files); done += files.length; }
    }
    if (!done && opts.force) dbgSheet('Kon foto’s niet lezen', lastErr);
    else if (done && list.length > 15) toast(done + ' foto’s uit galerij toegevoegd');
  } catch (e) { console.warn('scanGallery', e); if (opts.force) dbgSheet('Galerij lezen mislukt', 'Stap: ' + stage + '\nFout: ' + (e && (e.message || JSON.stringify(e)) || e)); }
  finally { SCANNING = false; }
}
if (NATIVE) {
  document.addEventListener('visibilitychange', () => { if (!document.hidden) scanGallery(); });
  setInterval(() => { if (!document.hidden) scanGallery(); }, 60000);
  setTimeout(() => scanGallery(), 2500);
}


init();
</script>
